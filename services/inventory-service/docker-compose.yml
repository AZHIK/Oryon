x-healthcheck-postgres: &healthcheck-postgres
  test: ["CMD-SHELL", "pg_isready -U oryonfoods -d oryonfoods_inventory"]
  interval: 5s
  timeout: 3s
  retries: 5

services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - "8100:8100"
    env_file: ./.env
    environment:
      - DB_URL=postgresql+asyncpg://oryonfoods:oryonfoods@postgres:5432/oryonfoods_inventory
      # Never use the test DB in runtime — .env must leave TEST_DB_URL unset;
      # this empty override guards against a stray TEST_DB_URL in .env.
      - TEST_DB_URL=
    volumes:
      - item_images:/var/lib/oryonfoods/item_images
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c=http.client.HTTPConnection('localhost',8100); c.request('GET','/health'); r=c.getresponse(); exit(0) if r.status==200 else exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    env_file: ./.env
    environment:
      POSTGRES_USER: oryonfoods
      POSTGRES_PASSWORD: oryonfoods
      POSTGRES_DB: oryonfoods_inventory
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates oryonfoods_inventory_test on FIRST init only (docker-entrypoint
      # scripts do not rerun on an existing data volume).
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck: *healthcheck-postgres
    restart: unless-stopped

  api-dev:
    build:
      context: .
      target: development
    profiles:
      - dev
    env_file: ./.env
    environment:
      - DB_URL=postgresql+asyncpg://oryonfoods:oryonfoods@postgres:5432/oryonfoods_inventory
      # Test runs (and conftest) target this separate database so the dev
      # database is never touched by the suite.
      - TEST_DB_URL=postgresql+asyncpg://oryonfoods:oryonfoods@postgres:5432/oryonfoods_inventory_test
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [""]
    command: ["tail", "-f", "/dev/null"]

volumes:
  postgres_data:
  item_images: