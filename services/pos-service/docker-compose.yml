x-healthcheck-postgres: &healthcheck-postgres
  test: ["CMD-SHELL", "pg_isready -U oryonfoods -d oryonfoods_pos"]
  interval: 5s
  timeout: 3s
  retries: 5

services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - "8200:8200"
    env_file: ./.env
    environment:
      - DB_URL=postgresql+asyncpg://oryonfoods:oryonfoods@postgres:5432/oryonfoods_pos
      - JWT_PUBLIC_KEY_PATH=/run/secrets/jwt_public.pem
    volumes:
      - ./keys/public.pem:/run/secrets/jwt_public.pem:ro
      - receipt_data:/var/lib/oryonfoods/receipts
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c=http.client.HTTPConnection('localhost',8200); c.request('GET','/health'); r=c.getresponse(); exit(0) if r.status==200 else exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    env_file: ./.env
    environment:
      POSTGRES_USER: oryonfoods
      POSTGRES_PASSWORD: oryonfoods
      POSTGRES_DB: oryonfoods_pos
    # Dev-only convenience port, loopback-bound so it is never public (SEC-03).
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck: *healthcheck-postgres
    restart: unless-stopped

  api-dev:
    build:
      context: .
      target: development
    profiles:
      - dev
    env_file: ./.env
    environment:
      - DB_URL=postgresql+asyncpg://oryonfoods:oryonfoods@postgres:5432/oryonfoods_pos
      # Test runs (and conftest) target this separate database so the dev
      # database is never touched by the suite.
      - TEST_DB_URL=postgresql+asyncpg://oryonfoods:oryonfoods@postgres:5432/oryonfoods_pos_test
      - JWT_PUBLIC_KEY_PATH=/run/secrets/jwt_public.pem
    volumes:
      - .:/app
      - ./keys/public.pem:/run/secrets/jwt_public.pem:ro
      - receipt_data:/var/lib/oryonfoods/receipts
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [""]
    command: ["tail", "-f", "/dev/null"]

volumes:
  postgres_data:
  receipt_data:
