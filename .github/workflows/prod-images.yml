name: Production images

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: prod-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-deploy:
    name: Validate deploy package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck python3-yaml

      - name: Shell syntax
        run: |
          bash -n deploy/scripts/*.sh deploy/host/*.sh deploy/compose/initdb/*.sh

      - name: ShellCheck
        run: |
          shellcheck -x -P deploy/scripts deploy/scripts/*.sh deploy/host/*.sh deploy/compose/initdb/*.sh

      - name: Compose configuration
        run: |
          cat > /tmp/deploy-ci.env <<'ENV'
          AUTH_HOST=auth.ci.invalid
          INVENTORY_HOST=inventory.ci.invalid
          POS_HOST=pos.ci.invalid
          ACME_EMAIL=ops@ci.invalid
          CORS_ALLOWED_ORIGINS=https://app.ci.invalid
          ADMIN_ALLOWLIST=127.0.0.1/32
          IMAGE_REGISTRY=ghcr.io/example
          IMAGE_TAG=sha-ci
          AT_USERNAME=ci
          AT_SENDER_ID=ORYON
          BREVO_FROM_EMAIL=no-reply@ci.invalid
          ENV
          docker compose --env-file /tmp/deploy-ci.env \
            -f deploy/compose/docker-compose.prod.yml config -q

      - name: Docker daemon config
        run: |
          sudo dockerd --validate --config-file deploy/host/daemon.json

      - name: Traefik templates
        run: |
          python3 - <<'PY'
          import pathlib
          import yaml

          root = pathlib.Path("deploy/traefik")
          static = (root / "traefik.yml.template").read_text().replace(
              "__ACME_EMAIL__", "ops@ci.invalid"
          )
          dynamic = (root / "dynamic.yml.template").read_text().replace(
              "__ADMIN_ALLOWLIST__", '"127.0.0.1/32"'
          )
          assert yaml.safe_load(static)
          assert yaml.safe_load(dynamic)
          print("Traefik templates parse successfully")
          PY

  build:
    name: Build and scan ${{ matrix.service }}
    needs: validate-deploy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [identity, inventory, pos]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image owner
        id: prep
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.prep.outputs.owner }}/oryon-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}-service
          target: runtime
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Verify runtime image has fixed UID and no keys
        run: |
          image="ghcr.io/${{ steps.prep.outputs.owner }}/oryon-${{ matrix.service }}@${{ steps.build.outputs.digest }}"
          docker run --rm --entrypoint sh "$image" -c \
            'test "$(id -u)" = "10001" && test ! -e /app/keys'

      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/${{ steps.prep.outputs.owner }}/oryon-${{ matrix.service }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Write deployment tag
        run: |
          {
            echo "### ${{ matrix.service }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
