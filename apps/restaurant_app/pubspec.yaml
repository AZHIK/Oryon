name: restaurant_pos
description: "The Oryon Foods point-of-sale and business management app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  intl: ^0.20.2
  pdf: ^3.12.0
  excel: ^4.0.6
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  file_selector: ^1.1.0
  xdg_directories: ^1.1.0
  image_picker: ^1.2.3
  fl_chart: ^1.2.0
  google_fonts: ^6.1.0
  uuid: ^4.0.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  sqlite3: ^3.5.2
  flutter_secure_storage: ^11.0.0
  connectivity_plus: ^7.3.1
  workmanager: ^0.10.9
  decimal: ^1.4.1
  crypto: ^3.0.3
  path: ^1.9.0
  dio: ^5.4.0
  http_parser: ^4.1.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.3
  build_runner: ^2.5.0

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true

  # Declared as an asset as well as a font family. The `fonts:` entry below
  # registers Inter with Flutter's text engine, but the PDF exporter has to
  # read the raw bytes through `rootBundle`, and only an `assets:` entry
  # guarantees the file is addressable that way.
  assets:
    - assets/fonts/Inter.ttf

  fonts:
    # Inter is shipped as a variable font: Flutter interpolates the `wght`
    # axis, so a single asset covers every FontWeight we use.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
