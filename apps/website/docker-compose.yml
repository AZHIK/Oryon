name: oryon-website

# Deploy from apps/website on the VPS. The existing Oryon Foods edge stack
# owns Traefik and the external `oryon_edge` network. This project only adds
# the public website container; it publishes no host ports.

services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${NEXT_PUBLIC_PLAUSIBLE_DOMAIN:-}
    image: ${WEBSITE_IMAGE:-oryon-website:local}
    restart: unless-stopped
    init: true
    read_only: true
    volumes:
      # Installers live on the host, not in the image. Create this directory
      # and publish with scripts/publish-release.sh. See DEPLOYMENT.md §6.
      - ${WEBSITE_DOWNLOADS_DIR:-/srv/oryon/downloads}:/usr/share/nginx/html/downloads:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=4m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "8080"
    networks:
      - edge
    mem_limit: 128m
    pids_limit: 64
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=oryon_edge"

      # Apex site
      - "traefik.http.routers.oryon-website.rule=Host(`${WEBSITE_HOST:-oryonfoods.com}`)"
      - "traefik.http.routers.oryon-website.entrypoints=websecure"
      - "traefik.http.routers.oryon-website.tls=true"
      - "traefik.http.routers.oryon-website.tls.certresolver=le"
      - "traefik.http.routers.oryon-website.middlewares=secure-headers@file,compress@file,general-rate-limit@file,body-limit@file"
      - "traefik.http.routers.oryon-website.service=oryon-website"

      # www -> apex
      - "traefik.http.routers.oryon-website-www.rule=Host(`www.${WEBSITE_HOST:-oryonfoods.com}`)"
      - "traefik.http.routers.oryon-website-www.entrypoints=websecure"
      - "traefik.http.routers.oryon-website-www.tls=true"
      - "traefik.http.routers.oryon-website-www.tls.certresolver=le"
      - "traefik.http.routers.oryon-website-www.middlewares=secure-headers@file,compress@file,general-rate-limit@file,oryon-www-redirect@docker"
      - "traefik.http.routers.oryon-website-www.service=oryon-website"
      - "traefik.http.middlewares.oryon-www-redirect.redirectregex.regex=^https?://[^/]+/(.*)"
      - "traefik.http.middlewares.oryon-www-redirect.redirectregex.replacement=https://${WEBSITE_HOST:-oryonfoods.com}/$$1"
      - "traefik.http.middlewares.oryon-www-redirect.redirectregex.permanent=true"

      # Container service
      - "traefik.http.services.oryon-website.loadbalancer.server.port=8080"
      - "traefik.http.services.oryon-website.loadbalancer.healthcheck.path=/healthz"
      - "traefik.http.services.oryon-website.loadbalancer.healthcheck.interval=15s"
      - "traefik.http.services.oryon-website.loadbalancer.healthcheck.timeout=5s"

networks:
  edge:
    external: true
    name: oryon_edge
