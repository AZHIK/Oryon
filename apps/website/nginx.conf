# Served by the non-root nginx-unprivileged image on port 8080.
# Traefik terminates TLS and applies the production security headers; the
# headers below are defence in depth if the container is ever served directly.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/xml
        application/javascript
        application/json
        application/rss+xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Container and Traefik load-balancer health check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Keep canonical URLs aligned with Next.js trailingSlash output.
    location = /download { return 301 /download/; }
    location = /support  { return 301 /support/; }
    location = /privacy  { return 301 /privacy/; }
    location = /terms    { return 301 /terms/; }

    # Hashed build output is safe to cache for a long time.
    location /_next/static/ {
        access_log off;
        expires 1y;
        try_files $uri =404;
    }

    # Store artwork is not content-hashed.
    location /badges/ {
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    # HTML and everything else stays revalidated.
    location / {
        try_files $uri $uri/ $uri.html =404;
        expires -1;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
