name: oryon-website-local

# Local preview only. This intentionally does NOT use the VPS Traefik labels
# or the external `oryon_edge` network. It publishes port 3000 and can run on
# any machine with a working Docker daemon.
#
#   docker compose -f docker-compose.local.yml up --build -d
#   open http://localhost:3000

services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${NEXT_PUBLIC_PLAUSIBLE_DOMAIN:-}
    image: oryon-website:local
    restart: "no"
    init: true
    read_only: true
    volumes:
      # Optional local installer directory. Put a file at
      # /tmp/oryon-downloads/Oryon-windows-x64-setup.exe to test the
      # "Coming soon" -> "Download" flip without rebuilding.
      - ${WEBSITE_DOWNLOADS_DIR:-/tmp/oryon-downloads}:/usr/share/nginx/html/downloads:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=4m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
